[project]
name = "edificia-agent"
version = "0.1.0"
description = "Servicio del agente EdificIA: orquestación de turnos, razonamiento y aprendizaje (cerebro Python, tools TS vía gateway)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "openai>=1.55",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
