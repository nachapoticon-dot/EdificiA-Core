services:
  web:
    build: .
    ports:
      - "3000:3000"
    env_file: .env.docker
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  agent:
    build: ./services/agent
    env_file: .env.docker
    environment:
      NEXTJS_INTERNAL_URL: http://web:3000
      DATABASE_URL: postgres://${POSTGRES_USER:-edificia}:${POSTGRES_PASSWORD:-edificia_dev}@postgres:5432/edificia
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/healthz\")'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    env_file: .env.docker
    environment:
      POSTGRES_DB: edificia
      POSTGRES_USER: ${POSTGRES_USER:-edificia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edificia_dev}
      # `--data-checksums` solo aplica al primer initdb (cluster vacío). Para clusters
      # existentes, ejecutar `pg_checksums --enable` con el server detenido.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    # Configuración WAL explícita y auditable. Cambios requieren reinicio del contenedor.
    command: >
      postgres
      -c wal_level=replica
      -c wal_compression=on
      -c max_wal_size=2GB
      -c min_wal_size=80MB
      -c checkpoint_completion_target=0.9
      -c synchronous_commit=on
      -c log_checkpoints=on
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Combina liveness (pg_isready) con verificación de que WAL está avanzando.
      # `pg_current_wal_lsn()` debe devolver un LSN no nulo si el WAL está activo.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edificia} -d edificia && psql -U ${POSTGRES_USER:-edificia} -d edificia -tAc 'SELECT pg_current_wal_lsn() IS NOT NULL' | grep -q t"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
